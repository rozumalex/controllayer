[project]
name = "controllayer-api"
version = "0.1.0"
description = "A control layer between AI agents and their tools: a pipeline of guards that inspects every tool call and result."
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "celery[redis]>=5.6.3",
    "fastapi[standard]>=0.142.2",
    "newrelic>=13.6.1",
    "pydantic-settings>=2.15.0",
    "sentry-sdk[celery,fastapi]>=2.71.0",
    "sqlalchemy[asyncio]>=2.1.2",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "ty>=0.0.84",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
