permission_ranks:
  LOW: 1
  STANDARD: 2
  PRIVILEGED: 3
classifications:
  PUBLIC:
    minimum_rank: 1
    default_action: allow
  INTERNAL:
    minimum_rank: 2
    default_action: allow
  CONFIDENTIAL:
    minimum_rank: 2
    default_action: redact_if_needed
  RESTRICTED:
    minimum_rank: 3
    default_action: block
security_rule: Prompt-injection and policy-bypass attempts are evaluated independently
  of data authorization and remain blockable for PRIVILEGED identities.
