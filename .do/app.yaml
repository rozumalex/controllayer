# DigitalOcean App Platform spec for the production stack. The deploy job in
# .github/workflows/main.yml creates the app from this file on the first run
# and updates it on every later one. The deploy action fills in ${APP_NAME},
# ${GITHUB_REPOSITORY}, the Sentry DSNs and the New Relic license key from the
# workflow environment.
# Quote them, so an unset one becomes an empty string.
# ${db.DATABASE_URL} and ${redis.DATABASE_URL} are App Platform variables and
# stay as they are.
name: ${APP_NAME}
region: fra

# The DNS for controllayer.net lives in Cloudflare: a CNAME on @ and on www to
# the app's ondigitalocean.app hostname, DNS only (not proxied).
domains:
  - domain: controllayer.net
    type: PRIMARY
  - domain: www.controllayer.net
    type: ALIAS

ingress:
  rules:
    # The backend gets /api/* unchanged, the way the Vite dev server sends it.
    - match:
        path:
          prefix: /api
      component:
        name: api
        preserve_path_prefix: true
    - match:
        path:
          prefix: /
      component:
        name: web

services:
  - name: api
    github: &github
      repo: ${GITHUB_REPOSITORY}
      branch: main
      # The deploy job deploys after the checks pass, so a push alone does not.
      deploy_on_push: false
    source_dir: src/backend
    dockerfile_path: src/backend/Dockerfile
    http_port: 8000
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    health_check:
      http_path: /api/health
    envs: &backend-envs
      - key: DATABASE_URL
        value: ${db.DATABASE_URL}
      - key: REDIS_URL
        value: ${redis.DATABASE_URL}
      - key: SENTRY_DSN
        value: "${SENTRY_DSN}"
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: NEW_RELIC_LICENSE_KEY
        value: "${NEW_RELIC_LICENSE_KEY}"
        type: SECRET
      - key: NEW_RELIC_APP_NAME
        value: "${APP_NAME}"

workers:
  # Worker and beat in one process. Keep one instance, or beat sends every
  # scheduled task once per instance. The app user cannot write to /app, so
  # the beat schedule file goes to /tmp. Celery starts one process per CPU of
  # the host, not of the instance, and 8 of them run out of its 512 MB, so
  # run one.
  - name: worker
    github: *github
    source_dir: src/backend
    dockerfile_path: src/backend/Dockerfile
    run_command: newrelic-admin run-program celery -A app.worker worker --beat --schedule /tmp/celerybeat-schedule --concurrency 1 --loglevel INFO
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    # On a deploy or restart, App Platform sends TERM. Celery then takes no new
    # tasks and waits for the running ones to finish. This is how long App
    # Platform waits before it kills the worker.
    termination:
      grace_period_seconds: 60
    envs: *backend-envs

jobs:
  - name: migrate
    kind: PRE_DEPLOY
    github: *github
    source_dir: src/backend
    dockerfile_path: src/backend/Dockerfile
    # Then reload the bank data, so every deploy starts from the same rows.
    # -y: the database isn't local, and there is no one to answer the prompt.
    run_command: sh -c "alembic upgrade head && python -m scripts.seed -y"
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
      - key: DATABASE_URL
        value: ${db.DATABASE_URL}

static_sites:
  - name: web
    github: *github
    source_dir: src/frontend
    build_command: pnpm build
    output_dir: dist
    # Send unknown paths to the app, so client-side routes load on refresh.
    catchall_document: index.html
    # Vite puts these into the built files.
    envs:
      - key: VITE_SENTRY_DSN
        value: "${VITE_SENTRY_DSN}"
        scope: BUILD_TIME
      - key: VITE_SENTRY_ENVIRONMENT
        value: production
        scope: BUILD_TIME

databases:
  # Managed clusters that the deploy job creates once, so the data stays when
  # the app redeploys or restarts.
  #
  # Postgres. Without db_user and db_name the app connects as the cluster's
  # admin user, which can create tables in the public schema. App Platform dev
  # databases cannot.
  - name: db
    engine: PG
    production: true
    cluster_name: ${APP_NAME}-db
  # Valkey, a Redis fork, as the Celery broker. The deploy job turns on RDB
  # persistence, so the queue survives a restart of the cluster, minus at most
  # the last 10 minutes.
  - name: redis
    engine: VALKEY
    production: true
    cluster_name: ${APP_NAME}-valkey
