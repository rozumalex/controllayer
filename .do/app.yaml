# DigitalOcean App Platform spec for the production stack. The deploy job in
# .github/workflows/main.yml creates the app from this file on the first run
# and updates it on every later one. The deploy action fills in ${APP_NAME},
# ${GITHUB_REPOSITORY}, the Sentry DSNs, the OpenAI key and the bank MCP
# token from the workflow environment.
# Quote them, so an unset one becomes an empty string.
# ${db.DATABASE_URL} is an App Platform variable and stays as it is.
name: ${APP_NAME}
region: fra

# The DNS for controllayer.net lives in Cloudflare: a CNAME on @ and on www to
# the app's ondigitalocean.app hostname, DNS only (not proxied).
domains:
  - domain: controllayer.net
    type: PRIMARY
  - domain: www.controllayer.net
    type: ALIAS

ingress:
  rules:
    # The backend gets /api/* unchanged, the way the Vite dev server sends it.
    - match:
        path:
          prefix: /api
      component:
        name: api
        preserve_path_prefix: true
    - match:
        path:
          prefix: /
      component:
        name: web

services:
  - name: api
    github: &github
      repo: ${GITHUB_REPOSITORY}
      branch: main
      # The deploy job deploys after the checks pass, so a push alone does not.
      deploy_on_push: false
    source_dir: src/backend
    dockerfile_path: src/backend/Dockerfile
    http_port: 8000
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    health_check:
      http_path: /api/health
    envs:
      - key: DATABASE_URL
        value: ${db.DATABASE_URL}
      - key: SENTRY_DSN
        value: "${SENTRY_DSN}"
      - key: SENTRY_ENVIRONMENT
        value: production
      # Unset, it stays empty, and the bank MCP server refuses every request.
      - key: BANK_MCP_TOKEN
        value: "${BANK_MCP_TOKEN}"
        type: SECRET
      # The chat model and the semantic injection guard. Without it the app
      # answers with the mock model and runs only the heuristic guard.
      - key: OPENAI_API_KEY
        value: "${OPENAI_API_KEY}"
        type: SECRET
      # Sign in with Google; unset, it is off. Not a secret.
      - key: GOOGLE_CLIENT_ID
        value: "${GOOGLE_CLIENT_ID}"
      # Sign-in codes go out through Resend, from hello@controllayer.net,
      # whose domain Resend has verified. Without the key, email sign-in is off.
      - key: RESEND_API_KEY
        value: "${RESEND_API_KEY}"
        type: SECRET
      # The sign-in link in the email opens the app here.
      - key: APP_URL
        value: https://controllayer.net

jobs:
  - name: migrate
    kind: PRE_DEPLOY
    github: *github
    source_dir: src/backend
    dockerfile_path: src/backend/Dockerfile
    # Then reload the bank data, so every deploy starts from the same rows.
    # -y: the database isn't local, and there is no one to answer the prompt.
    run_command: sh -c "alembic upgrade head && python -m scripts.seed -y"
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
      - key: DATABASE_URL
        value: ${db.DATABASE_URL}

static_sites:
  - name: web
    github: *github
    source_dir: src/frontend
    build_command: pnpm build
    output_dir: dist
    # Send unknown paths to the app, so client-side routes load on refresh.
    catchall_document: index.html
    # Vite puts these into the built files.
    envs:
      - key: VITE_SENTRY_DSN
        value: "${VITE_SENTRY_DSN}"
        scope: BUILD_TIME
      - key: VITE_SENTRY_ENVIRONMENT
        value: production
        scope: BUILD_TIME
      - key: VITE_GOOGLE_CLIENT_ID
        value: "${GOOGLE_CLIENT_ID}"
        scope: BUILD_TIME

databases:
  # A managed cluster that the deploy job creates once, so the data stays when
  # the app redeploys or restarts.
  #
  # Postgres. Without db_user and db_name the app connects as the cluster's
  # admin user, which can create tables in the public schema. App Platform dev
  # databases cannot.
  - name: db
    engine: PG
    production: true
    cluster_name: ${APP_NAME}-db
