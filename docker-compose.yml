# Development stack: the backend and the frontend run from the source code on
# the host and reload on every change.
x-database-url: &database-url postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-app}

x-redis-url: &redis-url redis://redis:6379/0

x-api-build: &api-build
  context: src/backend
  target: dev

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # A named volume, so the data stays after `docker compose down`.
      # Only `docker compose down -v` deletes it.
      - db-data:/var/lib/postgresql
    healthcheck:
      # -h localhost checks TCP. On first start, the entrypoint runs a temporary
      # server on the Unix socket only, and the socket check would pass too early.
      test: ["CMD-SHELL", "pg_isready -h localhost -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Runs once: applies the database migrations, then exits.
  migrate:
    build: *api-build
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: *database-url
    volumes:
      - ./src/backend:/app
    depends_on:
      db:
        condition: service_healthy

  api:
    build: *api-build
    environment:
      DATABASE_URL: *database-url
      REDIS_URL: *redis-url
      SENTRY_DSN: ${SENTRY_DSN:-}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME:-controllayer}
      # The chat model and the semantic injection guard. Without it the api
      # answers with the mock model and runs only the heuristic guard.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # The local models: an Ollama server's OpenAI-compatible API. Use
      # http://ollama:11434/v1 for the service below, or, on a Mac, Ollama on
      # the host at http://host.docker.internal:11434/v1, which uses the GPU.
      OLLAMA_URL: ${OLLAMA_URL:-}
      # Sign in with Google; empty turns it off.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Sign-in codes go out through Resend when RESEND_API_KEY is set, and to
      # Mailpit otherwise, whose inbox is at http://localhost:8025.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_FROM: ${SMTP_FROM:-Portcullis <hello@controllayer.net>}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_TLS: ${SMTP_TLS:-none}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # Save the messages with the events, so the dashboard shows what was
      # asked. Off in production, where prompts may hold secrets.
      CONTROL_LOG_PAYLOADS: ${CONTROL_LOG_PAYLOADS:-true}
      # The example bank MCP server's token, for its auth_header in the gateway.
      BANK_MCP_TOKEN: ${BANK_MCP_TOKEN:-dev-bank}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./src/backend:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')
      interval: 10s
      timeout: 3s
      retries: 3

  # Celery worker with the beat scheduler in the same process. watchfiles
  # restarts it on every code change. Keep one replica, or beat sends every
  # scheduled task once per replica.
  worker:
    build: *api-build
    command:
      - watchfiles
      - --filter
      - python
      # Keep the beat schedule file out of the source code mount.
      - newrelic-admin run-program celery -A app.worker worker --beat --schedule /tmp/celerybeat-schedule --loglevel INFO
      - app
    environment:
      DATABASE_URL: *database-url
      REDIS_URL: *redis-url
      SENTRY_DSN: ${SENTRY_DSN:-}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME:-controllayer}
    volumes:
      - ./src/backend:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3

  app:
    build:
      context: src/frontend
      target: dev
    environment:
      API_URL: http://api:8000
      VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "${APP_PORT:-3000}:5173"
    volumes:
      - ./src/frontend:/app
      # Keep the node_modules installed in the image, not the host's.
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy

  # Public HTTPS tunnel to the frontend, started only by `./dev ngrok`. The
  # Vite dev server sends /api/ requests on to the backend, so one tunnel
  # serves both. Get a free authtoken at https://dashboard.ngrok.com.
  ngrok:
    image: ngrok/ngrok:3-alpine
    profiles: [ngrok]
    command: ["http", "app:5173"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    depends_on:
      - app

  # Catches the email the api sends, such as sign-in codes, and shows it at
  # http://localhost:8025, so nothing leaves the machine.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAIL_UI_PORT:-8025}:8025"

  # Local models, started only by `./dev ollama`. Docker on a Mac has no GPU,
  # so there it is slow; run Ollama on the host instead.
  ollama:
    image: ollama/ollama:latest
    profiles: [ollama]
    volumes:
      - ollama-models:/root/.ollama

volumes:
  db-data:
  ollama-models:
